name: RetailIQ Week 1 tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline suite + LangGraph runtime
        run: |
          python -m pip install -r requirements-offline.txt 'langgraph>=1,<2' 'langchain-core>=1,<2'
      - name: Seed deterministic fixture
        run: python -m scripts.seed
      - name: Regression and compiled graph tests
        run: python -m pytest -q -rs

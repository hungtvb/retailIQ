name: RetailIQ Week 1 tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline suite + LangGraph runtime
        run: |
          python -m pip install -r requirements-offline.txt 'langgraph>=1,<2' 'langchain-core>=1,<2' 'langchain>=1,<2' 'langgraph-checkpoint-sqlite>=3,<4'
      - name: Seed deterministic fixture
        run: python -m scripts.seed
      - name: Verify active documentation links
        run: python -m scripts.check_docs_links
      # Independent Task 1 evidence while legacy endpoints are migrated to
      # authenticated HTTP fixtures in T06 Task 2. Never bypass auth in tests.
      - name: T06 authentication / CSRF focused tests
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'T06')
        run: python -m pytest -q tests/test_t06_auth.py tests/test_t06_ownership_sse.py tests/test_t06_workflow_ownership.py tests/test_t06_proposals.py tests/test_t06_manager_decision.py tests/test_t06_real_release_runner.py
      - name: Regression and compiled graph tests
        env:
          RETAILIQ_REQUIRE_LANGGRAPH: 'true'
        run: python -m pytest -q -rs
      - name: Business query acceptance audit (report gaps, do not hide them)
        run: python -m scripts.audit_queries --mode offline --strict
      - uses: actions/upload-artifact@v4
        with:
          name: retailiq-query-acceptance
          path: data/query_audit_report.json
          retention-days: 7
      - name: Four-week behavioral scenario audit (strict)
        run: python -m scripts.audit_workflows --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailiq-workflow-scenarios
          path: data/workflow_audit_report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Adversarial edge scenarios (strict)
        run: python -m scripts.audit_edge_scenarios --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailiq-edge-scenarios
          path: data/edge_scenario_audit.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Freshness-aware source routing acceptance (strict)
        run: python -m scripts.audit_freshness --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailiq-freshness-routing
          path: data/freshness_audit_report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Source reliability report from independent audit evidence
        run: python -m scripts.report_source_reliability --strict --freshness data/freshness_audit_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailiq-source-reliability
          path: data/source_reliability_report.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend safe-rendering, graph JS syntax and agent-branding tests
        run: |
          node --check web/assets/workflow-graph.js
          node --check web/assets/workflow-ui.js
          node --check web/assets/app.js
          node --test tests/frontend_format.test.cjs
          node --test tests/workflow_ui_journey.test.cjs
      - name: Typecheck and build product workspace (React + TypeScript)
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
          node --test tests/graph.contract.cjs
      - name: Browser E2E smoke (real Chromium + local FastAPI)
        run: |
          python -m pip install 'playwright>=1.52,<2'
          python -m scripts.smoke_workflow_browser
      - name: Product workspace E2E (real SSE + sessions + canvas)
        run: python -m scripts.smoke_product_workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailiq-workflow-browser-evidence
          path: |
            data/workflow_week4_*chromium.png
            data/retailiq_ui_*chromium.png
            data/retailiq_product_workspace_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Real MCP stdio transport acceptance (Inventory + Order)
        run: |
          python -m pip install 'mcp>=1.28,<2' 'langchain-mcp-adapters>=0.1,<1'
          python -m scripts.smoke_mcp_stdio
      # The retired EL-SKU browser MCP opt-in is incompatible with the single
      # Fiction source contract. Actual Fiction MCP stdio + compiled graph + SSE
      # are exercised above; browser-specific Fiction MCP acceptance stays #30.

  # This gate is intentionally PR-scoped: ordinary changes must not fetch
  # the 209MB Fiction LFS release. It verifies actual data, not a test fixture.
  fiction-t04-release:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'T04')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install supported-by-current-slice MCP dependencies
        run: python -m pip install 'mcp>=1.28,<2' 'langchain-mcp-adapters>=0.1,<1'
      - name: Fetch published Fiction LFS release (not source fixture)
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git lfs version
          git clone --depth 1 --filter=blob:none https://github.com/hungtvb/fiction-retail.git "$RUNNER_TEMP/fiction-retail"
          git -C "$RUNNER_TEMP/fiction-retail" lfs pull --include="data/fiction_retail.sqlite" --exclude=""
          test "$(stat -c%s "$RUNNER_TEMP/fiction-retail/data/fiction_retail.sqlite")" -eq 209063936
      - name: Pinned real Fiction release / independent SQL / MCP stdio
        run: |
          python -m scripts.verify_t04_real_release \
            --db "$RUNNER_TEMP/fiction-retail/data/fiction_retail.sqlite" \
            --manifest "$RUNNER_TEMP/fiction-retail/manifest.json" \
            --retailiq-manifest data/fiction/manifest.json

  # PR-scoped T02/graph-boundary regression on published Fiction, no provider secrets.
  # Refactor R1-A/R1-B can alter G1 routing; use the same oracle gate, no new workflow.
  # The paid G1 follows only after code merge and manual main dispatch.
  fiction-t02-oracle:
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.title, 'T02') || contains(github.event.pull_request.title, 'R1-A') || contains(github.event.pull_request.title, 'R1-B') || contains(github.event.pull_request.title, 'T05') || contains(github.event.pull_request.title, 'T06'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RETAILIQ_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline Fiction + compiled LangGraph runtime (no provider)
        run: |
          python -m pip install -r requirements-offline.txt 'langgraph>=1,<2' 'langchain-core>=1,<2' 'langchain>=1,<2' 'langgraph-checkpoint-sqlite>=3,<4'
      - name: Download published Fiction SQLite and source policy (no provider)
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git lfs version
          git clone --depth 1 --filter=blob:none https://github.com/hungtvb/fiction-retail.git "$RUNNER_TEMP/fiction-retail"
          git -C "$RUNNER_TEMP/fiction-retail" lfs pull --include="data/fiction_retail.sqlite" --exclude=""
          test "$(stat -c%s "$RUNNER_TEMP/fiction-retail/data/fiction_retail.sqlite")" -eq 209063936
          test -f "$RUNNER_TEMP/fiction-retail/knowledge/policies/FR-WH-2026-10-04.md"
      - name: Pinned G1 SQL/policy oracle + real API/graph with FAKE router (NO LLM)
        run: |
          python -m scripts.verify_uc01_live_release --oracle-only \
            --db "$RUNNER_TEMP/fiction-retail/data/fiction_retail.sqlite" \
            --manifest "$RUNNER_TEMP/fiction-retail/manifest.json" \
            --knowledge-root "$RUNNER_TEMP/fiction-retail/knowledge" \
            --retailiq-manifest data/fiction/manifest.json \
            --out data/quality_reports/uc01_t02_g1.json
      - name: T05 exact-policy G1 source, graph and citation (FAKE model, NO LLM)
        if: contains(github.event.pull_request.title, 'T05')
        run: |
          python -m scripts.verify_uc01_policy_live --oracle-only \
            --db "$RUNNER_TEMP/fiction-retail/data/fiction_retail.sqlite" \
            --manifest "$RUNNER_TEMP/fiction-retail/manifest.json" \
            --knowledge-root "$RUNNER_TEMP/fiction-retail/knowledge" \
            --retailiq-manifest data/fiction/manifest.json \
            --out data/quality_reports/uc01_t05_policy.json

      - name: T06 published G1 Analyst-to-Manager auth/proposal/CAS source oracle (NO LLM)
        if: contains(github.event.pull_request.title, 'T06')
        run: |
          python -m scripts.verify_t06_real_release \
            --db "$RUNNER_TEMP/fiction-retail/data/fiction_retail.sqlite" \
            --manifest "$RUNNER_TEMP/fiction-retail/manifest.json" \
            --knowledge-root "$RUNNER_TEMP/fiction-retail/knowledge" \
            --retailiq-manifest data/fiction/manifest.json \
            --out data/quality_reports/uc01_t06_g1.json

      - uses: actions/setup-node@v4
        if: contains(github.event.pull_request.title, 'T06')
        with:
          node-version: '22'
      - name: Build React Workspace for T06 G1 Chromium (NO LLM)
        if: contains(github.event.pull_request.title, 'T06')
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
          python -m pip install 'playwright>=1.52,<2'
      - name: T06 real Chromium login, Analyst submit, Manager review, owner reload
        if: contains(github.event.pull_request.title, 'T06')
        run: |
          python -m scripts.smoke_t06_browser \
            --db "$RUNNER_TEMP/fiction-retail/data/fiction_retail.sqlite" \
            --manifest "$RUNNER_TEMP/fiction-retail/manifest.json" \
            --knowledge-root "$RUNNER_TEMP/fiction-retail/knowledge" \
            --retailiq-manifest data/fiction/manifest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retailiq-t02-real-release-oracle
          path: |
            data/quality_reports/uc01_t02_g1.json
            data/quality_reports/uc01_t05_policy.json
            data/quality_reports/uc01_t06_g1.json
          if-no-files-found: ignore
          retention-days: 7

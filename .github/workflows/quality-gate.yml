name: RetailIQ localhost E2E and benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'quality/**'
    paths:
      - 'scripts/quality_gate.py'
      - 'tests/test_mocked_full_graph_e2e.py'
      - '.github/workflows/quality-gate.yml'
      - 'retailiq/**'
      - 'data/knowledge/**'
      - 'data/product_docs/**'
      - 'requirements-offline.txt'
  pull_request:
    paths:
      - 'scripts/quality_gate.py'
      - 'tests/test_mocked_full_graph_e2e.py'
      - '.github/workflows/quality-gate.yml'
      - 'retailiq/**'
      - 'data/knowledge/**'
      - 'data/product_docs/**'
      - 'requirements-offline.txt'

permissions:
  contents: read

jobs:
  localhost-e2e-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local server dependencies
        run: python -m pip install -r requirements-offline.txt 'langgraph>=1,<2' 'langchain-core>=1,<2' 'langchain>=1,<2' 'langgraph-checkpoint-sqlite>=3,<4'
      - name: Compiled LangGraph + mocked-provider ASGI E2E
        env:
          RETAILIQ_REQUIRE_LANGGRAPH: 'true'
        run: |
          python -m scripts.seed
          python -m pytest -q -rs tests/test_mocked_full_graph_e2e.py
      - name: Real localhost API/SSE E2E + synthetic throughput/latency
        run: python -m scripts.quality_gate --samples 50
      - name: Preserve machine-readable E2E/benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retailiq-quality-evidence
          path: data/quality_reports/e2e_benchmark.json
          if-no-files-found: warn
          retention-days: 14
